# Adblock List Manager Configuration
#
# Lists are processed in phase 1 (fetch + process) and separates each
# into categories: ipv4, ipv6, ips, domains, hosts, urls, abp.
#
# Combine entries are processed in phase 2 (last step) and merge the
# already-processed output from multiple lists into a new combined list.
#
# All list names must be unique across all sections.

# Cache time-to-live in hours. 24 = re-download if cached copy is older
# than 24 hours. Set to 0 to always re-download. Falls back to stale
# cache on download failure.
cache_ttl: 24

# Remote blocklist subscriptions (name → URL)
# The name determines the output directory under lists/<name>/
lists:
  # Main lists
  oisd-big: https://big.oisd.nl/
  HaGeZi-pro: https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/pro.txt
  AdGuard-Base: https://raw.githubusercontent.com/AdguardTeam/FiltersRegistry/master/filters/filter_2_Base/filter.txt
  AdGuard-Mobile: https://raw.githubusercontent.com/AdguardTeam/FiltersRegistry/master/filters/filter_11_Mobile/filter.txt
  urlhaus-malware: https://malware-filter.gitlab.io/malware-filter/urlhaus-filter.txt
  urlhaus-phishing: https://malware-filter.gitlab.io/malware-filter/phishing-filter.txt
  durablenapkin-scamblocklist: https://raw.githubusercontent.com/durablenapkin/scamblocklist/master/hosts.txt
  UBO-badware: https://ublockorigin.github.io/uAssets/filters/badware.txt
  DP-antimal: https://raw.githubusercontent.com/DandelionSprout/adfilt/refs/heads/master/Dandelion%20Sprout's%20Anti-Malware%20List.txt
  # someonewhocares: https://someonewhocares.org/hosts/hosts
  # easyprivacy: https://easylist.to/easylist/easyprivacy.txt

# Local custom list files (name → filename inside custom_lists/)
custom_lists:
  # my_handpicked: my_domains.txt
  # pihole_extra: extra_ads.txt

# Combined lists — merge already-processed lists into one
# Sources are concatenated in order, then deduplicated.
combine:
   main:
     - oisd-big
     - HaGeZi-pro
  # mega:
  #   - oisd
  #   - someonewhocares
  #   - my_handpicked
