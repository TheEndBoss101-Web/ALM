# Adblock List Manager Configuration
#
# Lists are processed in phase 1 (fetch + process) and separates each
# into categories: ipv4, ipv6, ips, domains, hosts, urls, abp.
#
# Combine entries are processed in phase 2 (last step) and merge the
# already-processed output from multiple lists into a new combined list.
#
# All list names must be unique across all sections.

# Cache time-to-live in hours. 24 = re-download if cached copy is older
# than 24 hours. Set to 0 to always re-download. Falls back to stale
# cache on download failure.
cache_ttl: 24

# Remote blocklist subscriptions (name → URL)
# The name determines the output directory under lists/<name>/
lists:
  # == Main list ==
  oisd-big: https://big.oisd.nl/
  hagezi-pro: https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/pro.txt
