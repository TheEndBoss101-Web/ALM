  adguard-dns: https://raw.githubusercontent.com/AdguardTeam/FiltersRegistry/master/filters/filter_15_DnsFilter/filter.txt
  urlhaus-malware: https://malware-filter.gitlab.io/malware-filter/urlhaus-filter.txt
  urlhaus-phishing: https://malware-filter.gitlab.io/malware-filter/phishing-filter.txt
  durablenapkin-scamblocklist: https://raw.githubusercontent.com/durablenapkin/scamblocklist/master/hosts.txt
  ublock-badware: https://ublockorigin.github.io/uAssets/filters/badware.txt
